<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">BluPhMap</title>
  <desc id="desc">A blue-green map pin containing a camera shutter</desc>
  <defs>
    <linearGradient id="background" x1="120" y1="80" x2="920" y2="950" gradientUnits="userSpaceOnUse">
      <stop stop-color="#172b55"/>
      <stop offset="0.55" stop-color="#0c4f78"/>
      <stop offset="1" stop-color="#082f4d"/>
    </linearGradient>
    <linearGradient id="pin" x1="300" y1="130" x2="730" y2="800" gradientUnits="userSpaceOnUse">
      <stop stop-color="#62e6c4"/>
      <stop offset="0.48" stop-color="#16b8b1"/>
      <stop offset="1" stop-color="#1688b6"/>
    </linearGradient>
    <linearGradient id="lens" x1="380" y1="280" x2="650" y2="560" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b4167"/>
      <stop offset="1" stop-color="#09263f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#020a16" flood-opacity="0.45"/>
    </filter>
    <clipPath id="clip">
      <rect x="32" y="32" width="960" height="960" rx="220"/>
    </clipPath>
  </defs>

  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#background)"/>
  <g clip-path="url(#clip)" fill="none" stroke="#8ad9e8" stroke-opacity="0.14" stroke-width="12">
    <path d="M-80 230C170 120 290 330 520 220S880 140 1100 260"/>
    <path d="M-80 760C160 620 300 850 500 720s360-80 620 20"/>
    <path d="M230 0c80 220 30 380 180 540s120 330 40 560"/>
    <path d="M780-40c-90 210-70 390-220 560s-90 350-30 520"/>
  </g>

  <path filter="url(#shadow)" fill="url(#pin)" d="M512 116c-166 0-300 132-300 296 0 207 300 496 300 496s300-289 300-496c0-164-134-296-300-296Z"/>
  <circle cx="512" cy="405" r="183" fill="#071f38" fill-opacity="0.92" stroke="#b4f7e7" stroke-width="18"/>
  <circle cx="512" cy="405" r="145" fill="url(#lens)" stroke="#53d9c5" stroke-width="12"/>

  <g fill="#e9fff8">
    <path d="M512 284 590 329 558 384 480 339Z"/>
    <path d="M633 335 633 425 569 425 569 335Z" transform="rotate(60 512 405)"/>
    <path d="M633 335 633 425 569 425 569 335Z" transform="rotate(120 512 405)"/>
    <path d="M633 335 633 425 569 425 569 335Z" transform="rotate(180 512 405)"/>
    <path d="M633 335 633 425 569 425 569 335Z" transform="rotate(240 512 405)"/>
    <path d="M633 335 633 425 569 425 569 335Z" transform="rotate(300 512 405)"/>
  </g>
  <circle cx="512" cy="405" r="48" fill="#61e6c5"/>
  <circle cx="512" cy="405" r="21" fill="#0a3450"/>
  <circle cx="458" cy="348" r="17" fill="#ffffff" fill-opacity="0.65"/>
</svg>
